name: Static validation

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project structure and data
        run: python tests/validate_project.py
      - name: Validate curriculum reference data
        run: python tests/validate_curriculum.py
      - name: Validate teacher demo
        run: python tests/validate_teacher_demo.py
      - name: Check the phase-change maths against the project data
        run: python tests/test_phase_model.py

  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" --version
      - name: Import project resources
        run: '"$GODOT_BIN" --headless --path . --import'
      - name: Install a virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Run UI probe (layout, placement, input gating) on a virtual display
        run: xvfb-run -a -s "-screen 0 2600x1500x24" "$GODOT_BIN" --path . --rendering-driver opengl3 res://tests/ui_probe.tscn -- "$RUNNER_TEMP/probe"
      - name: Run headless simulation scenarios
        run: '"$GODOT_BIN" --headless --path . res://tests/run_simulation_tests.tscn'
      - name: Run phase-change and thermal-profile tests
        run: '"$GODOT_BIN" --headless --path . res://tests/run_phase_change_tests.tscn'
